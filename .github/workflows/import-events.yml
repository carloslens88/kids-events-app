# Importa eventos infantiles cada madrugada y los deja como borradores
# en Supabase para que el admin los revise y publique desde /admin.
# Después limpia los borradores caducados (nunca publicados) para no
# acumular basura en la base de datos.
name: Importar eventos

on:
  schedule:
    - cron: '0 5 * * *' # todos los días a las 05:00 UTC (07:00 en Madrid en verano)
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar eventos a Supabase
        run: node scripts/import-events.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORGANIZER_IDS: ${{ secrets.EVENTBRITE_ORGANIZER_IDS }}
      - name: Limpiar borradores caducados sin publicar
        run: node scripts/cleanup-events.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
